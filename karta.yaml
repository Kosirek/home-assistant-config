title: Test
cards:
  - type: custom:button-card
    entity: switch.shelly1pmminig3_34b7dac7fdd0_switch_0
    show_name: false
    show_icon: false
    aspect_ratio: 1/1
    styles:
      card:
        - border-radius: 20px
        - padding: 12px
        - background: var(--card-background-color, '#1c1c1c')
        - box-shadow: var(--ha-card-box-shadow, 'none')
      grid:
        - grid-template-areas: |
            "motion"
            "main_button"
            "brightness_bar"
            "temp_bar"
        - grid-template-rows: 40px 1fr 45px 45px
        - grid-template-columns: 1fr
        - gap: 10px
    custom_fields:
      motion:
        card:
          type: custom:button-card
          entity: binary_sensor.czujnik_obecnosci
          icon: mdi:motion-sensor
          show_icon: true
          show_name: false
          styles:
            card:
              - background: none
              - box-shadow: none
              - width: 40px
              - justify-self: end
              - align-self: start
            icon:
              - width: 80%
              - color: >
                  [[[ return entity.state === 'on' ? '#00d2ff' : '#555555' ]]]
              - filter: >
                  [[[ return entity.state === 'on' ? 'drop-shadow(0 0 5px #00d2ff)' : 'none' ]]]
      main_button:
        card:
          type: custom:button-card
          entity: switch.shelly1pmminig3_34b7dac7fdd0_switch_0
          icon: mdi:power
          show_name: false
          tap_action:
            action: toggle
          styles:
            card:
              - width: 110px
              - height: 110px
              - border-radius: 50%
              - justify-self: center
              - align-self: center
              - transition: all 0.2s ease-in-out
              - background: >
                  [[[ return entity.state === 'on'
                      ? 'linear-gradient(145deg, #ffda62, #e6b800)'
                      : 'linear-gradient(145deg, #2e2e2e, #272727)' ]]]
              - box-shadow: >
                  [[[ return entity.state === 'on'
                      ? 'inset 8px 8px 16px #e6b800, inset -8px -8px 16px #ffff84, 5px 5px 15px rgba(0,0,0,0.4)'
                      : '6px 6px 12px #181818, -6px -6px 12px #3a3a3a' ]]]
            icon:
              - color: white
              - width: 45%
      brightness_bar:
        card:
          type: custom:button-card
          entity: sensor.czujnik_obecnosci_natezenie_oswietlenia
          name: Jasność
          show_icon: false
          show_state: true
          tap_action:
            action: more-info
          styles:
            card:
              - background: none
              - box-shadow: none
              - padding: 0
              - align-self: end
            grid:
              - grid-template-areas: '"n s" "bar bar"'
              - grid-template-columns: 1fr auto
            name:
              - justify-self: start
              - font-size: 12px
              - color: var(--secondary-text-color)
            state:
              - justify-self: end
              - font-size: 12px
              - font-weight: bold
            custom_fields:
              bar:
                - background: rgba(255,255,255,0.1)
                - border-radius: 5px
                - height: 10px
                - width: 100%
                - grid-area: bar
                - margin-top: 5px
                - position: relative
                - overflow: hidden
              fill:
                - position: absolute
                - top: 0
                - left: 0
                - height: 100%
                - border-radius: 5px
                - width: >
                    [[[ const val = parseFloat(entity.state) || 0;
                        const maxLux = 5000;
                        return Math.min(100, Math.max(0, (val / maxLux) * 100)) + '%'; ]]]
                - background: >
                    [[[ const val = parseFloat(entity.state) || 0;
                        if (val < 30) return '#e67e22';
                        if (val < 120) return '#f1c40f';
                        return '#ffffff'; ]]]
                - transition: width 0.5s ease, background-color 0.5s ease
          custom_fields:
            bar: >
              <div id="bar"></div>
            fill: >
              <div id="fill"></div>
      temp_bar:
        card:
          type: custom:button-card
          entity: sensor.temperatura_pracownia_temperatura
          name: Temperatura
          show_icon: false
          show_state: true
          tap_action:
            action: more-info
          styles:
            card:
              - background: none
              - box-shadow: none
              - padding: 0
              - align-self: end
            grid:
              - grid-template-areas: '"n s" "bar bar"'
              - grid-template-columns: 1fr auto
            name:
              - justify-self: start
              - font-size: 12px
              - color: var(--secondary-text-color)
            state:
              - justify-self: end
              - font-size: 12px
              - font-weight: bold
            custom_fields:
              bar:
                - background: rgba(255,255,255,0.1)
                - border-radius: 5px
                - height: 10px
                - width: 100%
                - grid-area: bar
                - margin-top: 5px
                - position: relative
                - overflow: hidden
              fill:
                - position: absolute
                - top: 0
                - left: 0
                - height: 100%
                - border-radius: 5px
                - width: >
                    [[[ const temp = parseFloat(entity.state) || 0;
                        const minTemp = 10;
                        const maxTemp = 30;
                        const percent = (temp - minTemp) / (maxTemp - minTemp) * 100;
                        return Math.min(100, Math.max(0, percent)) + '%'; ]]]
                - background: >
                    [[[ const temp = parseFloat(entity.state) || 0;
                        if (temp < 18) return '#3498db';
                        if (temp < 22) return '#2ecc71';
                        if (temp < 26) return '#e67e22';
                        return '#e74c3c'; ]]]
                - transition: width 0.5s ease, background-color 0.5s ease
          custom_fields:
            bar: >
              <div id="bar"></div>
            fill: >
              <div id="fill"></div>
